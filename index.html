canvas.addEventListener('pointerdown', e => {

  if (e.pointerType !== 'mouse') {   // 1.5.0: первый палец — второе ли касание двойного тапа
    const now = e.timeStamp || performance.now();   // время касания, а не обработки (занятая страница)
    if (pts.size === 0) {
      dblHold = !!(tap && now - tap.t < DT_MS && Math.hypot(e.clientX - tap.x, e.clientY - tap.y) < DT_PX);
      down0 = { t: now, x: e.clientX, y: e.clientY, id: e.pointerId, moved: false };
    } else {
      dblHold = false;
      down0 = null;
    }
    tap = null;
  }
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY, type: e.pointerType });
  begin(e);
});
canvas.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId) || !mode) return;
  if (down0 && e.pointerId === down0.id && Math.hypot(e.clientX - down0.x, e.clientY - down0.y) > TAP_PX) down0.moved = true;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY, type: e.pointerType });
  const a = [...pts.values()];
  if (mode === 'orbit' && a.length === 1) {
    orbit(a[0].x - last.x, a[0].y - last.y);
    last = { x: a[0].x, y: a[0].y };
  } else if (mode === 'pan' && a.length === 1) {
    pan(a[0].x - last.x, a[0].y - last.y, depth);
    last = { x: a[0].x, y: a[0].y };
  } else if (mode === 'pinch' && a.length >= 2) {
    const c = { x: (a[0].x + a[1].x) / 2, y: (a[0].y + a[1].y) / 2 };
    const d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
    pan(c.x - last.c.x, c.y - last.c.y, depth);
    if (d > 0 && last.d > 0) dollyTo(pivot, d / last.d);
    depth = depthTo(pivot);
    last = { c, d };
  }
});
function end(e) {
  // 1.5.0: короткое касание одним пальцем без хода — первый тап двойного (после двойного тапа — с нуля)
  if (down0 && e.pointerId === down0.id) {
    const now = e.timeStamp || performance.now();
    tap = !dblHold && !down0.moved && pts.size === 1 && now - down0.t < TAP_MS ? { t: now, x: e.clientX, y: e.clientY } : null;

}
canvas.addEventListener('pointerup', end);
canvas.addEventListener('pointercancel', end);
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  anim = null;
  untouched = false;
  const p = pick(e.clientX, e.clientY) || along(e.clientX, e.clientY);
  pivot.copy(p);
  pivotOk = true;
  dollyTo(p, Math.pow(1.0015, -e.deltaY));
}, { passive: false });

// видимость по тегам и объектам сцены
function apply(tags, pids) {
  const th = new Set(tags || []), ph = new Set(pids || []);
  root.traverse(o => {
    const u = o.userData || {};
    if (u.tag !== undefined || u.pid !== undefined) o.visible = !(th.has(u.tag) || ph.has(u.pid));
  });
  dirty = true;
}

// камера сцены: глаз, цель на уровне глаза (двухточечная — сдвигом кадра), рамка сцены вписана в экран
function corners(f) {
  const a = f[0], b = f[1], out = [];
  for (const x of [a[0], b[0]]) for (const y of [a[1], b[1]]) for (const z of [a[2], b[2]]) out.push(new V3(x, y, z));
  return out;
}
// полосы сверху (название) и снизу (кнопки сцен) закрывают край экрана — рамку сцены вписываем между ними
function bars() {
  const H = window.innerHeight || 1;
  const tb = $('bar'), sb = $('scenes');
  const t = tb && tb.style.display !== 'none' ? tb.getBoundingClientRect().bottom : 0;
  const b = sb && getComputedStyle(sb).display !== 'none' ? Math.max(0, H - sb.getBoundingClientRect().top) : 0;
  const k = Math.max(0.3, (H - t - b) / H);   // доля высоты, что видна
  return { k, d: (t - b) / H };                // d — сдвиг середины видимого (доля высоты, вниз)
}
function viewOf(s) {
  const c = (s && s.camera) || K.camera;
  if (!c) return null;
  const E = new V3(...c.eye), Tg = new V3(...(c.target2d || c.target));
  const f = Tg.clone().sub(E).normalize();
  let r = new V3().crossVectors(f, UP);
  if (r.length() < 1e-6) r = new V3(1, 0, 0);
  r.normalize();
  const u = new V3().crossVectors(r, f).normalize();
  const a = cam.aspect, A = K.asp || 1.6;
  const box = s && s.fit && QS.get('nofit') !== '1' ? corners(s.fit) : null;
  if (c.persp === false) {
    // параллельная: узкий угол издалека (почти без перспективы)
    const th = Math.tan(0.6 * Math.PI / 180);
    const ctr = Tg.clone();
    let H;
    if (box) {
      let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
      for (const p of box) {
        const v = p.clone().sub(Tg), x = v.dot(r), y = v.dot(u);
        x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y);
      }
      const bz = bars();
      H = Math.max((y1 - y0) / 2 / bz.k, (x1 - x0) / 2 / a) * 1.06;
      ctr.addScaledVector(r, (x0 + x1) / 2).addScaledVector(u, (y0 + y1) / 2 + bz.d * H);
    } else {
      H = (c.height || 3) / 2;
      if (a < A) H *= A / a;
    }
    return { E: ctr.clone().addScaledVector(f, -H / th), T: ctr, win: { cx: 0, cy: 0, h: th }, par: true };
  }
  const tv = Math.tan((c.fov || 35) * Math.PI / 360);
  if (box) {
    let ok = true, x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    for (const p of box) {
      const v = p.clone().sub(E), z = v.dot(f);
      if (z < 0.05) { ok = false; break; }
      const x = v.dot(r) / z, y = v.dot(u) / z;
      x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y);
    }
    if (ok) {
      const bz = bars();
      const h = Math.max((y1 - y0) / 2 / bz.k, (x1 - x0) / 2 / a) * 1.04;
      return { E, T: Tg, win: { cx: (x0 + x1) / 2, cy: (y0 + y1) / 2 + bz.d * h, h }, par: false };
    }
  }
  const sh = (c.target2d && c.shift) || [0, 0];
  const h = a >= A ? tv : tv * A / a;
  return { E, T: Tg, win: { cx: sh[0] * tv * A, cy: sh[1] * tv, h }, par: false };
}
function place(E, Tg, w) {
  cam.position.copy(E);
  cam.up.set(0, 1, 0);
  cam.lookAt(Tg);
  win.cx = w.cx; win.cy = w.cy; win.h = w.h;
}
function goTo(s, instant) {
  const v = viewOf(s);
  if (!v) return;
  cur = s;
  untouched = true;
  const fin = () => { anim = null; pivot.copy(v.T); pivotOk = true; nearFor(v.E.distanceTo(v.T)); };
  if (instant || v.par || par) {
    par = v.par;
    place(v.E, v.T, v.win);
    fin();
    return;
  }
  const E0 = cam.position.clone(), T0 = cam.position.clone().addScaledVector(fwd(), cam.position.distanceTo(v.T));
  const w0 = { ...win }, t0 = performance.now();
  anim = () => {
    const k = Math.min(1, (performance.now() - t0) / 650), q = ss(k);
    place(E0.clone().lerp(v.E, q), T0.clone().lerp(v.T, q),
      { cx: w0.cx + (v.win.cx - w0.cx) * q, cy: w0.cy + (v.win.cy - w0.cy) * q, h: w0.h + (v.win.h - w0.h) * q });
    proj();
    if (k >= 1) fin();
  };
}

// движение открытых копий (KTNium Anim): двери и подъёмник — поворот вокруг оси, ящики — выдвиг; k = 0 закрыто, 1 открыто
const AN = [];
const byPid = new Map();
let motion = null;
function mk(a, k) {
  const m = new THREE.Matrix4();
  if (a.kind === 'drawer') {
    const s = a.slide || [0, 0, 0];
    return m.makeTranslation(s[0] * k, s[1] * k, s[2] * k);
  }
  const p = a.pivot || [0, 0, 0];
  const ax = new V3(...(a.axis || [0, 0, 1])).normalize();
  return m.makeTranslation(p[0], p[1], p[2])
    .multiply(new THREE.Matrix4().makeRotationAxis(ax, (a.angle || 0) * Math.PI / 180 * k))
    .multiply(new THREE.Matrix4().makeTranslation(-p[0], -p[1], -p[2]));
}
function setK(e, k) {
  e.o.matrix.copy(mk(e.a, k));
  e.o.matrix.decompose(e.o.position, e.o.quaternion, e.o.scale);
}
function animIndex() {
  root.traverse(o => {
    const u = o.userData || {};
    if (u.pid !== undefined) { if (!byPid.has(u.pid)) byPid.set(u.pid, []); byPid.get(u.pid).push(o); }
    const a = u.anim;
    if (!a || (a.kind !== 'door' && a.kind !== 'drawer')) return;
    o.updateMatrix();
    const m1 = mk(a, 1), d = o.matrix.elements.reduce((s, x, i) => Math.max(s, Math.abs(x - m1.elements[i])), 0);
    if (d < 2e-3) AN.push({ o, a });   // открытое положение сходится с выгрузкой — двигаем
  });
}
function finishMotion() {
  if (!motion) return;
  for (const e of motion.open) setK(e, 1);
  endClose(motion);
  motion = null;
}
function endClose(m) {
  for (const o of m.forced) o.visible = false;
  for (const o of m.held) o.visible = true;
  for (const e of m.close) setK(e, 1);
  m.forced = []; m.held = []; m.close = [];
}
function stepMotion() {
  const el = performance.now() - motion.t;
  if (motion.close.length) {
    const q = ss(el / 900);
    for (const e of motion.close) setK(e, 1 - q);
    if (el >= 900) endClose(motion);
  }
  const ko = (el - 850) / 1200;
  if (ko > 0) { const q = ss(ko); for (const e of motion.open) setK(e, q); }
  if (ko >= 1 && !motion.close.length) motion = null;
}

// сечение: плоскость сцены и линии разреза
let cutObj = null;
const cutCache = new Map();
function cutLines(pl) {
  const pos = [];
  const a = new V3(), b = new V3(), c = new V3(), off = pl.normal.clone().multiplyScalar(0.0004);
  root.updateMatrixWorld(true);
  root.traverse(o => {
    if (!o.isMesh || o.isLineSegments2 || !shown(o) || glass(o.material)) return;
    const g = o.geometry;
    if (!g.boundingBox) g.computeBoundingBox();
    if (!pl.intersectsBox(g.boundingBox.clone().applyMatrix4(o.matrixWorld))) return;
    const P = g.attributes.position, I = g.index, n = I ? I.count : P.count, mw = o.matrixWorld;
    for (let i = 0; i + 2 < n; i += 3) {
      a.fromBufferAttribute(P, I ? I.getX(i) : i).applyMatrix4(mw);
      b.fromBufferAttribute(P, I ? I.getX(i + 1) : i + 1).applyMatrix4(mw);
      c.fromBufferAttribute(P, I ? I.getX(i + 2) : i + 2).applyMatrix4(mw);
      const da = pl.distanceToPoint(a), db = pl.distanceToPoint(b), dc = pl.distanceToPoint(c);
      if ((da > 0 && db > 0 && dc > 0) || (da < 0 && db < 0 && dc < 0)) continue;
      if (Math.abs(da) < 1e-7 && Math.abs(db) < 1e-7 && Math.abs(dc) < 1e-7) continue;
      const out = [];
      for (const [p, q, dp, dq] of [[a, b, da, db], [b, c, db, dc], [c, a, dc, da]]) {
        if ((dp > 0) !== (dq > 0) && Math.abs(dp - dq) > 1e-12) out.push(p.clone().lerp(q, dp / (dp - dq)).add(off));
      }
      if (out.length >= 2) pos.push(out[0].x, out[0].y, out[0].z, out[1].x, out[1].y, out[1].z);
    }
  });
  return pos;
}
function setClip(s) {
  if (cutObj) { scene.remove(cutObj); cutObj = null; }
  const cl = s && s.clip;
  if (!cl) { renderer.clippingPlanes = []; return; }
  const pl = new THREE.Plane(new V3(cl[0], cl[1], cl[2]), cl[3]);
  renderer.clippingPlanes = [];
  let g = cutCache.get(s);
  if (!g) {
    const pos = cutLines(pl);
    g = new LineSegmentsGeometry();
    if (pos.length) g.setPositions(pos);
    cutCache.set(s, g);
  }
  renderer.clippingPlanes = [pl];
  if (g.attributes.instanceStart && g.attributes.instanceStart.count) {
    cutObj = new LineSegments2(g, cutMat);
    cutObj.raycast = () => {};
    scene.add(cutObj);
  }
}

// смена сцены: видимость, сечение, камера, движение дверей и ящиков
function show(i, instant) {
  const s = K.scenes[i];
  if (!s) return;
  finishMotion();
  const v0 = new Map(AN.map(e => [e, shown(e.o)]));
  apply(s.hidden_tags !== undefined ? s.hidden_tags : K.hidden_tags, s.hidden_pids || []);
  setClip(s);
  goTo(s, instant);
  if (instant) return;
  const m = { open: [], close: [], forced: [], held: [], t: performance.now() };
  for (const e of AN) {
    const v1 = shown(e.o);
    if (!v0.get(e) && v1) { m.open.push(e); setK(e, 0); }
    else if (v0.get(e) && !v1) m.close.push(e);
  }
  // закрываются на глазах: их группа видна, пока не закроются; оригиналы — после
  for (const e of m.close) {
    for (let o = e.o; o && o !== root; o = o.parent) if (!o.visible && !m.forced.includes(o)) { o.visible = true; m.forced.push(o); }
    for (const o of byPid.get(e.a.of) || []) if (o.visible) { o.visible = false; m.held.push(o); }
  }
  if (m.open.length || m.close.length) motion = m;
}
// 1.6.0: кнопки сцен — пачкой: текущая целиком, у остальных слева номер (полоска — до конца номера), внахлёст
let actIdx = 0;
function stack() {
  const Wd = $('sw');
  if (!Wd) return;
  const bs = [...Wd.children];
  const n = bs.length;
  const A = Wd.clientWidth;
  if (!n || A <= 0) return;
  bs.forEach(b => { b.style.width = ''; b.style.left = '0px'; });
  const w = bs.map(b => b.offsetWidth);                      // ширина целиком
  const st = bs.map((b, i) => {                              // полоска с номером
    const q = b.querySelector('.n');
    return q ? Math.min(w[i], q.offsetLeft + q.offsetWidth + 4) : Math.min(w[i], 40);
  });
  const a = Math.min(Math.max(actIdx, 0), n - 1);
  const G = 4;
  let Sa = 0;
  for (let i = 0; i < n; i++) if (i !== a) Sa += st[i];
  // текущая — целиком, но не шире 62 % и так, чтобы номера прочих были видны; совсем тесно — номер и 40 точек имени
  const wa = Math.max(Math.min(w[a], st[a] + 40), Math.min(w[a], A * 0.62, A - G - Sa));
  const R = A - wa - (n > 1 ? G : 0);                        // место прочим
  const v = w.map((x, i) => (i === a ? 0 : x + G));           // видно у прочих: целиком
  let F = 0, Sm = 0, Ex = 0;
  for (let i = 0; i < n; i++) if (i !== a) { F += v[i]; Sm += st[i]; Ex += Math.max(0, v[i] - st[i]); }
  if (F > R) {
    for (let i = 0; i < n; i++) {
      if (i === a) continue;
      if (R >= Sm) v[i] = st[i] + (Ex > 0 ? (R - Sm) * Math.max(0, w[i] + G - st[i]) / Ex : 0);   // номер виден, лишнее — поровну долям
      else v[i] = st[i] * Math.max(R, 0) / Sm;                                                  // пачка большая — сжать пропорционально
    }
  }
  const xs = [];
  let x = 0;
  for (let i = 0; i < n; i++) { xs.push(x); x += i === a ? wa + G : v[i]; }
  bs.forEach((b, i) => {
    b.style.zIndex = String(i + 1);
    b.style.left = Math.round(xs[i]) + 'px';
    if (i === a) b.style.width = Math.round(wa) + 'px';
    else if (i < a) b.style.width = Math.round(Math.max(st[i], Math.min(w[i], xs[a] + wa / 2 - xs[i]))) + 'px';   // под текущей — не дальше её середины
    else if (i === n - 1) b.style.width = Math.max(8, Math.round(Math.min(w[i], A - xs[i]))) + 'px';            // последняя — не за край
  });
}
function setAct(i) {
  actIdx = i;
  const Wd = $('sw');
  if (Wd) [...Wd.children].forEach((x, j) => x.classList.toggle('on', j === i));
  stack();
}
function buttons() {
  const S = $('scenes');
  S.innerHTML = '<div id="sw"></div>';
  const Wd = $('sw');
  K.scenes.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'b' + (i === 0 ? ' on' : '');
    const m = /^(\d+)(\.?\s*.*)$/.exec(String(s.name || ''));   // номер — отдельно: полоска до конца цифр
    if (m) {
      const q = document.createElement('span');
      q.className = 'n';
      q.textContent = m[1];
      b.appendChild(q);
      b.appendChild(document.createTextNode(m[2]));
    } else b.textContent = s.name;
    b.title = s.name;
    b.onclick = () => { setAct(i); show(i, false); };
    Wd.appendChild(b);
  });
  S.style.display = K.scenes.length > 1 ? 'block' : 'none';
  actIdx = 0;
  stack();
}
window.addEventListener('resize', () => stack());
// рёбра, как в SketchUp: где грани сходятся под углом больше 20°
function addEdges(r) {
  const lm = new THREE.LineBasicMaterial({ color: 0x2a2a2a, transparent: true, opacity: 0.5 });
  const cache = new Map(), ms = [];
  r.traverse(o => { if (o.isMesh) ms.push(o); });
  ms.forEach(m => {
    let g = cache.get(m.geometry);
    if (!g) { g = new THREE.EdgesGeometry(m.geometry, 20); cache.set(m.geometry, g); }
    const l = new THREE.LineSegments(g, lm);
    l.raycast = () => {};
    m.add(l);
  });
}
async function open(id) {
  msg(T.loading);
  try {
    // 1.4.0: данные модели — от скрипта Google без входа (вход в Google в браузере не мешает); 1.6.0: на странице скрипта — google.script.run
    let r;
    if (GS) r = await call('model', id);
    else {
      const resp = await fetch(cfg.exec + '?m=' + encodeURIComponent(id) + '&raw=1', { credentials: 'omit', cache: 'no-store' });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      r = await resp.json();
    }
    if (r.error) throw new Error(/Not in|No folder|Invalid|not found|не найден|Недопустим|идентификатор/i.test(r.error) ? (RU ? 'модель не найдена' : 'model not found') : r.error);
    $('title').textContent = nice(r.name);
    document.title = nice(r.name);
    const bin = Uint8Array.from(atob(r.data), ch => ch.charCodeAt(0));
    const g = await new Promise((ok, no) => new GLTFLoader().parse(bin.buffer, '', ok, no));
    root = g.scene;
    K = (g.parser.json.extras && g.parser.json.extras.ktn) || {};
    K.scenes = K.scenes || [];
    K.hidden_tags = K.hidden_tags || [];
    addEdges(root);
    scene.add(root);
    new THREE.Box3().setFromObject(root).getBoundingSphere(bs);
    size = Math.max(0.5, bs.radius * 2);
    animIndex();
    if (!K.camera) {
      const bx = new THREE.Box3().setFromObject(root), c = bx.getCenter(new V3());
      const d = bx.getSize(new V3()).length();
      K.camera = { eye: [c.x + d * 0.6, c.y + d * 0.4, c.z + d * 0.8], target: [c.x, c.y, c.z], fov: 35 };
    }
    buttons();   // сперва полосы — рамка сцены вписывается между ними
    if (K.scenes.length) {
      show(0, true);
    } else {
      apply(K.hidden_tags, []);
      goTo(null, true);
    }
    msg('');
    window.__ready = true;
  } catch (e) {
    msg(T.err + ': ' + ((e && e.message) || e));
    window.__ready = true;
  }
}
window.__v = { pos: () => cam.position.toArray().map(x => +x.toFixed(4)), dir: () => fwd().toArray().map(x => +x.toFixed(4)), show: i => show(i, false), tick: () => { if (anim) anim(); if (motion) stepMotion(); if (composer) composer.render(); else renderer.render(scene, cam); }, state: () => ({ motion: !!motion, anim: !!anim, n: AN.length, ao: !!composer, aoOff: window.__aoOff || '', clip: renderer.clippingPlanes.length, win: { ...win }, par }) };
if (cfg.id) {
  open(cfg.id);
} else {
  $('bar').style.display = 'none';
  msg(T.nolink);
  window.__ready = true;
}
