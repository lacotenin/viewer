<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>KTNium Viewer</title>
<style>
/* 1.8.0: системная лупа и выделение текста на двойном тапе — нет: ничего на странице не выделяется */
* { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }   /* страница не увеличивается двойным тапом */
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #f4f4f2; color: #222;
  -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
/* 1.8.0: название — в капсуле (стекло), у полосы фона нет (его слова 05.11: «Название проекта пусть тоже будет в капсуле и
   без фона панели») */
#bar { position: fixed; left: 0; right: 0; top: 0; z-index: 2; display: flex; gap: 10px; align-items: center;
  padding: calc(8px + env(safe-area-inset-top)) 10px 0; background: none; pointer-events: none; }
/* 1.8.2: название — мельче (13 пт), стекло — как у плашки материала (его слова 05.11: «Название проекта напиши помельче»;
   «Сд стекло как на яйфоне. Ты же сдел так плашку с материалом изначально.») */
#title { flex: 0 1 auto; min-width: 0; max-width: calc(100vw - 20px); box-sizing: border-box; padding: 0 12px; height: 30px;
  line-height: 30px; border-radius: 15px; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: #1c1c1e; background: linear-gradient(180deg, rgba(255,255,255,.66), rgba(255,255,255,.34));
  -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.95), inset 0 0 0 1px rgba(255,255,255,.55), 0 8px 20px rgba(0,0,0,.16), 0 1px 3px rgba(0,0,0,.12); }
#scenes { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; display: none; pointer-events: none;
  padding: 10px 0 calc(12px + env(safe-area-inset-bottom)); background: none; }   /* 1.7.0: у полосы сцен фона нет */
#sw { position: relative; height: 40px; pointer-events: auto; touch-action: none; -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; }   /* 1.8.2: простая лента — плашки в ряд, листается пальцем */
.b { flex: none; border: 0; border-radius: 18px; padding: 9px 14px; background: #e4e6ea; color: #222; font: inherit;
  text-decoration: none; cursor: pointer; }
.b.on { background: #2f6db5; color: #fff; }
/* 1.7.0: плашки — стекло; текущая — синее стекло. 1.8.2: стекло — как у плашки материала (его слова 05.11: «Сд стекло как на
   яйфоне. Ты же сдел так плашку с материалом изначально.»); плашки в ряд, не в пачке */
#sw .b { position: absolute; top: 0; left: 0; height: 40px; max-width: 70vw; padding: 0 16px 0 13px; border-radius: 20px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transform-origin: 50% 50%; will-change: transform;
  color: #1c1c1e; background: linear-gradient(180deg, rgba(255,255,255,.66), rgba(255,255,255,.34));
  -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.95), inset 0 0 0 1px rgba(255,255,255,.55), 0 8px 20px rgba(0,0,0,.16), 0 1px 3px rgba(0,0,0,.12); }
#sw .b .n { font-weight: 600; }
#sw .b.on { color: #fff; background: linear-gradient(180deg, rgba(74,140,222,.86), rgba(38,98,178,.78));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.6), inset 0 0 0 1px rgba(255,255,255,.3), 0 8px 20px rgba(24,70,140,.3), 0 1px 3px rgba(0,0,0,.14); }
/* 1.9.11: масштаб картинки — круглые «+» и «−» слева от ленты сцен (стекло, как у плашек); лента начинается за ними и
   режется по бокам (плашки не заезжают под кнопки) */
#zm { position: fixed; left: 10px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 3; display: flex; gap: 8px; }
#zm .zb { width: 40px; height: 40px; border-radius: 20px; border: 0; padding: 0; display: flex; align-items: center;
  justify-content: center; font: inherit; font-size: 26px; font-weight: 500; line-height: 1; color: #1c1c1e; cursor: pointer;
  touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  background: linear-gradient(180deg, rgba(255,255,255,.66), rgba(255,255,255,.34));
  -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.95), inset 0 0 0 1px rgba(255,255,255,.55), 0 8px 20px rgba(0,0,0,.16), 0 1px 3px rgba(0,0,0,.12); }
#zm .zb.dn { transform: scale(.92); }
#zm #zmn { display: none; }
#sw { margin-left: 58px; -webkit-clip-path: inset(-40px 0 -40px 0); clip-path: inset(-40px 0 -40px 0); }
#scenes.zm2 #sw { margin-left: 106px; }
/* 1.9.12: альбомный — лента во всю ширину низа (за безопасными полями выреза); «+» и «−» — в сетке кнопок слева */
body.land #sw { margin-right: env(safe-area-inset-right); }   /* 1.9.13: слева — как в книжном: за «+» и «−» */
/* 1.7.0: справа — капсулы деталей сцены, листаются по кругу */
#pw { position: fixed; right: 8px; top: 120px; z-index: 2; display: none; width: 0; height: 300px; pointer-events: none; }
#pw .c { position: absolute; right: 0; top: 50%; height: 34px; margin-top: -17px; max-width: min(46vw, 210px); padding: 0 13px;
  box-sizing: border-box; border-radius: 17px; display: none; line-height: 34px; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; font-size: 14px; color: #1c1c1e; pointer-events: auto; touch-action: none; cursor: pointer;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; transform-origin: 100% 50%; will-change: transform, opacity;
  background: linear-gradient(180deg, rgba(255,255,255,.66), rgba(255,255,255,.34));
  -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.95), inset 0 0 0 1px rgba(255,255,255,.55), 0 6px 16px rgba(0,0,0,.14), 0 1px 3px rgba(0,0,0,.1); }
/* 1.8.0: плашка детали — низкая, во всю ширину: материал · размер, одной строкой; 1.8.2: материал — 17 пт жирно, размер — 15 пт
   (его слова 05.11: «а вот нащвание материала ... пусть будут виднее») */
#fc { left: 8px; right: 8px; top: 60px; padding: 5px 14px; border-radius: 16px; text-align: center; font-size: 15px; line-height: 22px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#fc .m { font-size: 17px; font-weight: 700; color: #000; }
#fc .s { font-variant-numeric: tabular-nums; }
#pw .c.nb { min-width: 44px; text-align: center; padding: 0 12px; font-size: 18px; font-weight: 700; color: #000;
  font-variant-numeric: tabular-nums; }   /* 1.8.2: номера — 18 пт жирно (его слова 05.11: «номера в капсулах пусть будут виднее») */
#pw .c.hold { box-shadow: 0 0 0 2px rgba(47,109,181,.75), 0 8px 22px rgba(0,0,0,.25); }
#pw.pws .c { transition: transform .34s cubic-bezier(.2,.9,.25,1); }   /* 1.9.6: капсулы уезжают за край и обратно */
/* 1.8.0: деталь как в раскрое — карточка из капсулы */
#sh { position: fixed; z-index: 5; display: none; flex-direction: column; overflow: hidden; border-radius: 22px; color: #1c1c1e;
  transform-origin: 100% 50%; transition: transform .46s cubic-bezier(.2,1.25,.35,1), opacity .22s ease; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  background: linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,.78));
  -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.95), inset 0 0 0 1px rgba(255,255,255,.6), 0 18px 44px rgba(0,0,0,.28); }
#sh .hd2 { display: flex; align-items: center; gap: 10px; padding: 12px 14px 6px; }
#sh .num { flex: none; min-width: 34px; height: 30px; padding: 0 10px; box-sizing: border-box; border-radius: 15px; line-height: 30px;
  text-align: center; font-weight: 700; color: #fff; background: linear-gradient(180deg, #4a8cde, #2662b2); }
#sh .tt { min-width: 0; }
#sh .tt b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#sh .tt span { display: block; font-size: 13px; color: #3a3a3c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#sh svg { flex: 1; min-height: 0; width: 100%; display: block; }
#sh .lg { flex: none; display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 6px 14px 12px; font-size: 13px; color: #2c2c2e; }
#sh .lg i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; border-radius: 50%; vertical-align: -1px; }
#sh .lg i.b { background: transparent !important; border: 1.6px dashed currentColor; width: 7px; height: 7px; }
/* 1.8.0: пятая кнопка — Комментарий */
#cmb { left: 218px; }
#cmt { left: 10px; bottom: 132px; max-width: min(92vw, 440px); max-height: 42vh; overflow: auto; padding: 10px 14px;
  border-radius: 18px; white-space: pre-wrap; overflow-wrap: anywhere; pointer-events: auto; font-size: 15px; }
#pw .c.on { color: #fff; background: linear-gradient(180deg, rgba(74,140,222,.86), rgba(38,98,178,.78));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.6), inset 0 0 0 1px rgba(255,255,255,.3), 0 6px 16px rgba(24,70,140,.3); }
/* 1.7.0: удержание пальца — кружок (дальше палец двигает вид) */
#ring { position: fixed; left: -100px; top: -100px; z-index: 4; width: 64px; height: 64px; margin: -32px 0 0 -32px;
  border-radius: 50%; pointer-events: none; opacity: 0; transform: scale(.3); border: 2px solid rgba(255,255,255,.95);
  background: rgba(47,109,181,.18); box-shadow: 0 0 0 1px rgba(47,109,181,.55), 0 4px 14px rgba(0,0,0,.18);
  transition: opacity .12s ease, transform .4s cubic-bezier(.3,1.6,.5,1); }
#ring.on { opacity: 1; transform: scale(1); }
/* 1.7.0: кнопки над сценами слева — рулетка и Part info */
.fb { position: fixed; bottom: calc(72px + env(safe-area-inset-bottom)); z-index: 2; display: none; width: 44px; height: 44px;
  padding: 0; border: 0; border-radius: 22px; align-items: center; justify-content: center; color: #1c1c1e; cursor: pointer;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  background: linear-gradient(180deg, rgba(255,255,255,.66), rgba(255,255,255,.34));
  -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.95), inset 0 0 0 1px rgba(255,255,255,.55), 0 8px 20px rgba(0,0,0,.16), 0 1px 3px rgba(0,0,0,.12); }
.fb.on { color: #fff; background: linear-gradient(180deg, rgba(74,140,222,.86), rgba(38,98,178,.78));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.6), inset 0 0 0 1px rgba(255,255,255,.3), 0 8px 20px rgba(24,70,140,.3); }
.fb svg { width: 26px; height: 26px; }
#ms { left: 10px; }
#pib { left: 62px; }
#scb { left: 114px; }
#lkb { left: 166px; }
.fb.has:not(.on) { color: #2f6db5; }   /* куб стоит, кнопка не нажата */
#lkb svg g { display: none; }
#lkb[data-k="tex"] .lk-tex, #lkb[data-k="col"] .lk-col, #lkb[data-k="mono"] .lk-mono { display: inline; }
/* 1.7.0: ручка угла сечения — двигать */
.hd { position: fixed; left: 0; top: 0; z-index: 2; display: none; width: 40px; height: 40px; margin: -20px 0 0 -20px;
  border-radius: 20px; align-items: center; justify-content: center; color: #2f6db5; touch-action: none;
  -webkit-user-select: none; user-select: none; cursor: move;
  background: linear-gradient(180deg, rgba(255,255,255,.66), rgba(255,255,255,.34));
  -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.95), inset 0 0 0 1px rgba(255,255,255,.55), 0 8px 20px rgba(0,0,0,.16), 0 1px 3px rgba(0,0,0,.12); }
.hd.on { background: linear-gradient(180deg, rgba(255,255,255,.88), rgba(255,255,255,.6)); }
.hd svg { width: 22px; height: 22px; }
/* 1.9.0: ручка — небольшая точка (его слова 05.11: «Сд кнопку перемещения куба просто небольшой точкой»): без стекла и
   стрелок, синяя точка с белым кантом; место под палец — прежние 40 точек; ведёшь — точка крупнее */
.hd, .hd.on { background: none; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
.hd svg { display: none; }
.hd::after { content: ''; width: 12px; height: 12px; border-radius: 50%; background: #2f6db5;
  box-shadow: 0 0 0 2px #fff, 0 1px 5px rgba(0,0,0,.4); transition: transform .15s ease; }
.hd.on::after { transform: scale(1.4); }
#mo { position: fixed; left: 0; top: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; overflow: visible; }
.gl { position: fixed; z-index: 2; display: none; pointer-events: none; color: #1c1c1e; border-radius: 16px;
  background: linear-gradient(180deg, rgba(255,255,255,.66), rgba(255,255,255,.34));
  -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.95), inset 0 0 0 1px rgba(255,255,255,.55), 0 8px 20px rgba(0,0,0,.16), 0 1px 3px rgba(0,0,0,.12); }
#mlab { left: 0; top: 0; transform: translate(-50%, -135%); padding: 6px 12px; font-weight: 600; white-space: nowrap; }
#pic { left: 10px; top: 60px; max-width: calc(100vw - 84px); padding: 9px 14px; border-radius: 18px; }
#pic .t { font-weight: 600; overflow-wrap: anywhere; }
#pic .s { margin-top: 2px; font-variant-numeric: tabular-nums; }
#pic .m { margin-top: 2px; color: #3a3a3c; font-size: 13px; }
/* 1.7.0: лупа рулетки — увеличенный кусок под пальцем, перекрестье, точка, куда встанет */
#lpf { position: fixed; left: 0; top: 0; z-index: 3; display: none; width: 124px; height: 124px; pointer-events: none;
  border-radius: 8px; box-shadow: 0 0 0 2px rgba(255,255,255,.95), 0 0 0 3px rgba(0,0,0,.2), 0 10px 26px rgba(0,0,0,.3); }
#lpf::before, #lpf::after { content: ''; position: absolute; background: rgba(47,109,181,.75); }
#lpf::before { left: 50%; top: 36%; width: 1px; height: 28%; }
#lpf::after { top: 50%; left: 36%; height: 1px; width: 28%; }
#lpf b { position: absolute; left: 50%; top: 50%; width: 9px; height: 9px; margin: -6.5px 0 0 -6.5px; border-radius: 50%;
  border: 2px solid #2f6db5; background: #fff; }
/* 1.9.0: окна Отчёт и Раскрой — от названия до низа; ручка сверху; свайп вниз (у верха листания) — закрыть */
.pn { position: fixed; left: 8px; right: 8px; top: 60px; bottom: calc(8px + env(safe-area-inset-bottom)); z-index: 6; display: none;
  flex-direction: column; overflow: hidden; border-radius: 22px; color: #1c1c1e; touch-action: pan-x pan-y;
  transform: translateY(28px); opacity: 0; transition: transform .34s cubic-bezier(.2,1.15,.35,1), opacity .2s ease;
  background: linear-gradient(180deg, rgba(255,255,255,.93), rgba(255,255,255,.84));
  -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.95), inset 0 0 0 1px rgba(255,255,255,.6), 0 18px 44px rgba(0,0,0,.28); }
.pn.on { transform: none; opacity: 1; }
.pn .ph { position: relative; flex: none; display: flex; align-items: center; gap: 8px; padding: 16px 14px 8px; }
.pn .ph b { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; font-size: 16px; }
.pn .gr { position: absolute; left: 50%; top: 6px; width: 38px; height: 5px; margin-left: -19px; border-radius: 3px; background: rgba(0,0,0,.2); }
.pn .pk { position: absolute; left: 50%; bottom: 66px; transform: translateX(-50%); z-index: 4; padding: 7px 14px; border-radius: 16px;
  font-size: 14px; font-weight: 600; color: #fff; background: rgba(28,28,30,.82); opacity: 0; transition: opacity .2s ease; pointer-events: none; }
.pn .pk.on { opacity: 1; }
/* Отчёт: таблица — как в окне Report (только отмеченное), шапка и изделия — на месте при листании */
#rp .rw { flex: 1; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; margin: 0 6px; }
#rp table { border-collapse: separate; border-spacing: 0; font-size: 13px; line-height: 1.25; font-variant-numeric: tabular-nums; }
#rp th, #rp td { padding: 6px 8px; border-bottom: 1px solid rgba(0,0,0,.08); white-space: nowrap; text-align: right; background: rgba(255,255,255,.97); }
#rp thead th { position: sticky; top: 0; z-index: 2; font-weight: 600; background: rgba(244,244,246,.98); }
#rp thead tr + tr th { top: var(--h1, 28px); }
#rp th.g { text-align: left; }
#rp th.c { min-width: 44px; max-width: 132px; white-space: normal; text-align: center; font-size: 12px; vertical-align: bottom; }
#rp .g0 { border-left: 1px solid rgba(0,0,0,.14); }
#rp .p { position: sticky; left: 0; z-index: 1; text-align: left; font-weight: 600; max-width: 38vw; white-space: normal;
  box-shadow: 1px 0 0 rgba(0,0,0,.1); }
#rp thead th.p { z-index: 3; vertical-align: bottom; }
#rp td.e, #rp th.e { background: rgba(232,236,241,.98); }
#rp tfoot td { font-weight: 600; background: rgba(247,247,248,.98); }
#rp .re { padding: 24px 16px; color: #3a3a3c; }
/* 1.9.2: список — как окно List отчёта: разделы, имя слева, данные справа */
#rp .rl { padding: 0 14px 10px; }
#rp .rl h5 { margin: 12px 0 2px; font-size: 12px; font-weight: 600; color: #6c6c70; text-transform: uppercase; letter-spacing: .04em; }
#rp .rl .r { display: flex; gap: 12px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid rgba(0,0,0,.07);
  font-size: 15px; line-height: 1.3; }
#rp .rl .r span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
#rp .rl .r b { flex: none; max-width: 50%; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
#rp .rb { flex: none; display: flex; gap: 8px; padding: 10px 10px 12px; }
#rp .rb button { flex: 1; min-width: 0; height: 42px; padding: 0 8px; border: 0; border-radius: 21px; font: inherit; font-size: 14px;
  font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
  background: linear-gradient(180deg, rgba(74,140,222,.95), rgba(38,98,178,.92));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 6px 14px rgba(24,70,140,.25); }
#rp .rb button:active { transform: scale(.97); }
/* 1.9.0: Раскрой — фон поля раскроя; один столбик материала на экране, листы сверху вниз; вбок — другой материал */
#ns { background: linear-gradient(180deg, rgba(233,234,237,.97), rgba(228,229,233,.95)); }
#ns .ph .tx { flex: none; width: 20px; height: 20px; border-radius: 50%; background: #ddd center / cover no-repeat; box-shadow: 0 0 0 1px rgba(0,0,0,.18); }
#ns .ph span { flex: none; font-size: 13px; color: #3a3a3c; }
#ns .dt { flex: none; display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; padding: 0 14px 8px; }
#ns .dt:empty { display: none; }
#ns .dt i { width: 7px; height: 7px; border-radius: 4px; background: rgba(0,0,0,.22); cursor: pointer; }
#ns .dt i.on { background: #2f6db5; }
#ns .nv { flex: 1; min-height: 0; position: relative; overflow: hidden; }
#ns .nr { position: absolute; top: 0; bottom: 0; left: 0; display: flex; will-change: transform; }
#ns .nc { flex: none; height: 100%; box-sizing: border-box; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain; padding: 0 10px 18px; }
#ns canvas { display: block; }
/* 1.9.0: Область зума — прямоугольник пальцем */
